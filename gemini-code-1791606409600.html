<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TechLock X - Ultimate Gaming HUD & Music</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Orbitron & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05050a;
            color: #e2e8f0;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .glass-panel {
            background: rgba(13, 13, 25, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 243, 255, 0.05);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2);
        }
        .neon-text-cyan {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.4);
        }
        .neon-glow-purple {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), inset 0 0 10px rgba(168, 85, 247, 0.2);
        }
        .neon-text-purple {
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.7), 0 0 20px rgba(168, 85, 247, 0.4);
        }
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            height: 6px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #00f3ff;
            cursor: pointer;
            box-shadow: 0 0 12px #00f3ff;
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.3);
        }
        /* Equalizer Animation Bars */
        .eq-bar {
            width: 3px;
            background: #00f3ff;
            animation: bounce 0.8s infinite ease-in-out alternate;
        }
        .eq-bar:nth-child(2) { animation-delay: 0.2s; background: #a855f7; }
        .eq-bar:nth-child(3) { animation-delay: 0.4s; background: #ec4899; }
        .eq-bar:nth-child(4) { animation-delay: 0.1s; background: #3b82f6; }
        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 22px; }
        }
        .paused-eq .eq-bar {
            animation-play-state: paused;
            height: 4px !important;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 243, 255, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen relative pb-12">

    <!-- Background Ambient Glows -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-cyan-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Top Header Navigation -->
    <header class="sticky top-0 z-50 glass-panel border-b border-cyan-500/20 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center neon-glow-cyan">
                <i class="fa-solid fa-shield-halved text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-orbitron font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 neon-text-cyan">TECHLOCK X</h1>
                <p class="text-[10px] text-cyan-300/70 tracking-widest font-mono">SYSTEM v5.0 • MUSIC HUD</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <div id="connection-status" class="flex items-center space-x-1.5 px-3 py-1 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-mono">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                <span id="status-text">CHƯA KÍCH HOẠT</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-5 mt-2">

        <!-- Key Authentication Section -->
        <section id="auth-section" class="glass-panel rounded-2xl p-4 border border-cyan-500/30 relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-cyan-500/10 rounded-full blur-xl pointer-events-none"></div>
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-orbitron text-sm font-bold text-cyan-300 flex items-center space-x-2">
                    <i class="fa-solid fa-key text-cyan-400"></i>
                    <span>XÁC THỰC VIP KEY</span>
                </h2>
                <span class="text-[10px] text-gray-400 font-mono">JSON External Source</span>
            </div>
            <div class="space-y-3">
                <div class="relative">
                    <input type="text" id="key-input" placeholder="Nhập VIP Key từ keys.json..." class="w-full bg-black/40 border border-cyan-500/30 rounded-xl px-4 py-2.5 text-sm text-cyan-200 placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 font-mono transition">
                    <button onclick="clearKey()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-cyan-300 text-xs">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <button onclick="verifyKey()" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-orbitron font-bold text-sm text-white neon-glow-cyan active:scale-98 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-lock-open"></i>
                    <span>KÍCH HOẠT HỆ THỐNG</span>
                </button>
            </div>
            <p id="auth-message" class="text-xs text-center mt-2.5 font-mono min-h-[18px] text-gray-400"></p>
        </section>

        <!-- Main Dashboard Controls (Locked initially) -->
        <div id="dashboard-controls" class="space-y-4 opacity-40 pointer-events-none transition-all duration-300">

            <!-- 1. BẬT NHẠC CHƠI GAME (GAMING MUSIC PLAYER) -->
            <section class="glass-panel rounded-2xl p-4 space-y-3.5 border border-cyan-500/40 relative overflow-hidden bg-gradient-to-br from-purple-950/20 via-black/40 to-cyan-950/20">
                <div class="flex items-center justify-between">
                    <h3 class="font-orbitron text-xs font-bold text-cyan-300 flex items-center space-x-2">
                        <i class="fa-solid fa-music text-cyan-400"></i>
                        <span>BẬT NHẠC CHƠI GAME</span>
                    </h3>
                    <!-- Equalizer Animation Widget -->
                    <div id="equalizer" class="flex items-end space-x-1 h-6 paused-eq px-2 py-0.5 rounded bg-black/40 border border-cyan-500/20">
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                    </div>
                </div>

                <!-- Track Info -->
                <div class="p-3 rounded-xl bg-black/40 border border-white/5 space-y-2">
                    <div class="flex items-center justify-between">
                        <div>
                            <p id="track-title" class="text-xs font-bold text-cyan-200 font-orbitron">Cyberpunk Gaming Phonk</p>
                            <p id="track-artist" class="text-[10px] text-gray-400">TechLock Audio v1.0</p>
                        </div>
                        <span id="player-status-badge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-gray-800 text-gray-400">PAUSED</span>
                    </div>

                    <!-- Track Selector Dropdown -->
                    <select id="track-select" onchange="changeTrack(this.value)" class="w-full bg-black/60 border border-cyan-500/30 rounded-lg px-2.5 py-1.5 text-xs text-cyan-300 font-mono focus:outline-none focus:border-cyan-400">
                        <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">🎵 Track 1: Cyberpunk Phonk Remix</option>
                        <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">⚡ Track 2: High Speed Gaming Electro</option>
                        <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">🔥 Track 3: Epic Battle Synthwave</option>
                        <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3">💎 Track 4: Chill Lo-Fi Lobby Music</option>
                    </select>
                </div>

                <!-- Music Controls Bar -->
                <div class="flex items-center justify-between space-x-2 pt-1">
                    <button onclick="prevTrack()" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 hover:border-cyan-500 text-cyan-300 flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="play-pause-btn" onclick="togglePlayMusic()" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-orbitron font-bold text-xs text-white neon-glow-cyan active:scale-95 transition flex items-center justify-center space-x-2">
                        <i id="play-icon" class="fa-solid fa-play"></i>
                        <span id="play-text">PHÁT NHẠC</span>
                    </button>
                    <button onclick="nextTrack()" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 hover:border-cyan-500 text-cyan-300 flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>

                <!-- Volume Slider -->
                <div class="flex items-center space-x-3 pt-1">
                    <i class="fa-solid fa-volume-high text-cyan-400 text-xs"></i>
                    <input type="range" id="volume-slider" min="0" max="100" value="80" class="w-full accent-cyan-400" oninput="updateVolume(this.value)">
                    <span id="volume-val" class="font-mono text-[10px] text-cyan-400 w-8 text-right">80%</span>
                </div>

                <!-- Hidden HTML5 Audio Element -->
                <audio id="game-audio" preload="auto" loop>
                    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                    Trình duyệt của bạn không hỗ trợ phát âm thanh.
                </audio>
            </section>

            <!-- Core Toggles Section -->
            <section class="glass-panel rounded-2xl p-4 space-y-3.5 border border-purple-500/20">
                <h3 class="font-orbitron text-xs font-bold text-purple-300 tracking-wider flex items-center justify-between">
                    <span><i class="fa-solid fa-sliders mr-2 text-purple-400">
